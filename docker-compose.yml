services:
  realtime:
    build:
      context: ./Backend
    environment:
      REALTIME_HOST: 0.0.0.0
      REALTIME_PORT: 8787
    ports:
      - "127.0.0.1:8788:8787"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
    depends_on:
      - realtime
    ports:
      - "8080:80"
    restart: unless-stopped
